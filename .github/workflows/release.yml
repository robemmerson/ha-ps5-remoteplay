name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  INTEGRATION_PATH: custom_components/ps5_remoteplay
  ZIP_NAME: ps5_remoteplay.zip

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$INTEGRATION_PATH/manifest.json")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest. Bump manifest.json before tagging."
            exit 1
          fi
          echo "Releasing $manifest"

      - name: Check the library pin matches the manifest
        run: |
          pin=$(python3 -c 'import json,sys; print(next(r for r in json.load(open(sys.argv[1]))["requirements"] if r.startswith("ps5-remoteplay")))' "$INTEGRATION_PATH/manifest.json")
          if ! grep -qxF "$pin" requirements-test.txt; then
            echo "::error::requirements-test.txt does not pin $pin, which manifest.json requires."
            exit 1
          fi
          echo "Library pin agrees: $pin"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest -q

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  release:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build the integration zip
        run: |
          cd "$INTEGRATION_PATH"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*__pycache__*' '*.pyc'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
